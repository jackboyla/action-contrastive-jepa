defaults:
  - lewm
  - _self_

output_model_name: lewm_masked_h

wm:
  type: lewm_masked_h
  prediction_mode: masked_horizon
  history_size: 3
  horizon: 5
  num_preds: ${wm.horizon}   # data loads history_size + horizon = 8-step windows

# Inverse-dynamics head (anti-collapse), identical to lewm_masked.
inverse:
  hidden_dim: 512
  depth: 2
  dropout: 0.0

loss:
  # SIGReg OFF — anti-collapse comes from the inverse-dynamics term. The H-step
  # forward task is meant to force encoding of slow/indirect objects (PushT block).
  sigreg:
    weight: 0.0
  horizon_weights:
    schedule: uniform
    normalize: false
  masked:
    inverse_weight: 1.0
    inverse_warmup_epochs: 0

wandb:
  config:
    project: masked-transition-lewm
    name: ${output_model_name}
