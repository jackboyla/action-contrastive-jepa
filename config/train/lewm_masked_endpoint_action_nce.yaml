defaults:
  - lewm_masked_ms_inverse
  - _self_

output_model_name: lewm_masked_endpoint_action_nce

data:
  dataset:
    # Keep one-step AR targets (`wm.num_preds=1`) while loading enough frames
    # for endpoint inverse gaps up to `wm.horizon`.
    num_steps: ${eval:'${wm.history_size} + ${wm.horizon}'}

loss:
  masked:
    inverse_loss_type: action_nce
    action_nce_temperature: 0.1
    inverse_weight: 0.30

wandb:
  config:
    project: masked-transition-lewm
    name: ${output_model_name}
