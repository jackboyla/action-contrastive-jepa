defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBScene-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  history_size: 1
  frame_skip: 1
  env_type: scene
  ob_type: states
  multiview: False
  width: 64
  height: 64
  visualize_info: False
  terminate_at_goal: True

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# Evaluation from OGBench expert trajectories. The goal is the future visual
# observation; privileged state columns only reset the simulator and target.
eval:
  num_eval: 50
  env_batch_size: null
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: ogbench/visual_scene_play
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        button_state_0:
          value: button_state_0
        button_state_1:
          value: button_state_1
    - method: set_cube_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat
    - method: set_target_button_state
      args:
        button_id:
          value: 0
          in_dataset: False
        target_state:
          value: goal_button_state_0
    - method: set_target_button_state
      args:
        button_id:
          value: 1
          in_dataset: False
        target_state:
          value: goal_button_state_1
    - method: set_target_drawer_pos
      args:
        target_pos:
          value: goal_privileged_drawer_pos
    - method: set_target_window_pos
      args:
        target_pos:
          value: goal_privileged_window_pos

output:
  filename: ogb_scene_results.txt
  save_video: false
  save_planning_artifacts: false
  planning_artifacts_dir: null
